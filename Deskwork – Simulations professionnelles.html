<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deskwork – Apprendre en exerçant le métier</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1fb;--panel:#fff;--ink:#1b1f3b;--mute:#5d6280;--line:#dcd8ee;--acc:#6d4fd1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12142a;--panel:#1d2040;--ink:#eceefb;--mute:#a4a9c8;--line:#32365e}}
:root[data-theme="dark"]{--bg:#12142a;--panel:#1d2040;--ink:#eceefb;--mute:#a4a9c8;--line:#32365e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 400px at 85% -5%,color-mix(in srgb,#e8761b 14%,transparent),transparent),radial-gradient(800px 400px at 0 0,color-mix(in srgb,#2563eb 14%,transparent),transparent),var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.55 'IBM Plex Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.1;margin:0 0 .5em;letter-spacing:-.02em}
h1{font-size:clamp(2.2rem,6vw,3.8rem);font-weight:800}h2{font-size:1.7rem}h3{font-size:1.15rem}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header .wrap{display:flex;align-items:center;gap:14px;height:58px}
.logo{font:800 1.3rem 'Bricolage Grotesque';margin-right:auto;background:linear-gradient(90deg,#6d4fd1,#d6336c,#e8761b);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:2px}nav button{background:none;border:0;color:var(--mute);font:500 .93rem 'IBM Plex Sans';padding:8px 10px;cursor:pointer;border-radius:8px}
nav button.on,nav button:hover{color:var(--ink);background:color-mix(in srgb,var(--acc) 14%,var(--panel))}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
main{padding:34px 0 60px}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:30px;align-items:center;margin-bottom:44px}
@media(max-width:720px){.hero{grid-template-columns:1fr}}
.lede{color:var(--mute);font-size:1.08rem;max-width:52ch}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 20px;font:600 1rem 'IBM Plex Sans';cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.memo{border-left:6px solid var(--acc)}.memo small{color:var(--acc);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:16px}
.card{--f:#6d4fd1;display:flex;flex-direction:column;text-align:left;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:0;overflow:hidden;cursor:pointer;transition:transform .15s}
.card:hover{transform:translateY(-3px);border-color:var(--f)}
.card svg{display:block;width:100%;height:auto}.card .tx{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.card h3{margin:0;color:var(--f)}.card .muted{font-size:.92rem}
.pill{display:inline-block;font-size:.78rem;padding:2px 10px;border-radius:99px;background:color-mix(in srgb,var(--acc) 15%,var(--panel));color:var(--acc);font-weight:600;width:fit-content}
.opts{display:grid;gap:10px;margin:16px 0}
.opt{text-align:left;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer}
.opt:hover{border-color:var(--acc)}.opt[disabled]{cursor:default}
.opt.best{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,var(--panel))}.opt.pick{outline:2px solid var(--ink)}
.opt b{display:block}.opt span{color:var(--mute);font-size:.92rem}
.meters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
@media(max-width:560px){.meters{grid-template-columns:repeat(2,1fr)}}
.m{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;border-top:4px solid var(--acc)}
.m small{color:var(--mute);display:block}.m strong{font:800 1.5rem 'Bricolage Grotesque'}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sk{display:grid;grid-template-columns:170px 1fr 44px;gap:12px;align-items:center;margin:10px 0}
@media(max-width:520px){.sk{grid-template-columns:110px 1fr 38px}}
.hint{background:color-mix(in srgb,var(--acc) 14%,var(--panel));border-radius:10px;padding:10px 14px;margin:10px 0;display:none}
.fb{background:color-mix(in srgb,var(--acc) 12%,var(--panel));border-radius:10px;padding:10px 14px;margin-top:12px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:var(--panel);border:0;color:var(--ink);padding:8px 14px;font:inherit;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg)}
.top{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:center;margin-bottom:18px}
@media(max-width:620px){.top{grid-template-columns:1fr}}
.top svg{width:100%;border-radius:14px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:.95rem;vertical-align:top}
.muted{color:var(--mute)}.tw{background:color-mix(in srgb,#e8761b 16%,var(--panel));border-radius:10px;padding:10px 14px;margin:0 0 12px}
</style>
</head>

{n:'Finance',col:'#0f7b6c',ro:'Directeur financier en pleine crise de trésorerie.',car:'DAF, trésorier, analyste financier',ctx:'Halden Composants a 480 k€ en banque, une paie de 210 k€ dans deux semaines et un gros client qui n’a pas payé. Le conseil attend votre plan.',m:[['Trésorerie',' k€',480],['Confiance fournisseurs','/10',6],['Exposition au risque','/10',2]],

r:[{t:'Semaine 1 · L’annonce',q:'La fusion des équipes est décidée. Comment l’annoncez-vous ?',h:'Les rumeurs avancent plus vite que vous.',o:[['Réunir tout le monde, expliquer les raisons et répondre','Transparence.',[-5,2,1],'9888'],['Envoyer un e-mail court','Impersonnel.',[-5,-2,0],'3333'],['Attendre d’avoir tous les détails','Rumeurs.',[-10,-3,-1],'2122']]},
{t:'Semaine 3 · Le collaborateur clé',q:'Votre meilleur expert, démotivé, envisage de partir.',h:'Écoutez avant de proposer.',o:[['Un entretien individuel pour comprendre','Écoute active.',[5,2,1],'9899'],['Lui promettre une prime','Solution à court terme.',[0,0,-1],'3334'],['Ne rien faire','Risque de départ.',[-10,-2,-1],'1111']]},
{t:'Semaine 5 · Le conflit',q:'Deux managers s’opposent sur les priorités de l’équipe fusionnée.',h:'Cherchez un objectif commun.',o:[['Organiser une médiation avec des objectifs communs','Désamorce le conflit.',[8,2,2],'9899'],['Trancher sans les écouter','Frustrations.',[3,-2,0],'3333'],['Les laisser régler seuls','Le conflit s’enlise.',[-8,-2,-1],'2111']]}]}
];
let S=null,hist=[],view='home',cur=0;
try{hist=JSON.parse(localStorage.getItem('dw-hist2')||'[]')}catch(e){}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const col=()=>app.style.setProperty('--acc',view==='setup'||view==='play'||view==='report'?F[cur].col:'#6d4fd1');
function nav(v){view=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));scrollTo(0,0);col();({home,missions,dash,setup,play,report})[v]()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>nav(b.dataset.v));
const best=n=>Math.max(0,...hist.filter(h=>h.f===n).map(h=>h.total));
function cards(){return `<div class="grid">`+F.map((f,i)=>`<button class="card" style="--f:${f.col}" data-i="${i}">${scene(i,f.col)}<div class="tx"><h3>${f.n}</h3><span class="muted">${f.ro}</span><span class="pill" style="background:${f.col}22;color:${f.col}">${best(f.n)?'Meilleur score : '+best(f.n):'3 décisions · 5 min'}</span></div></button>`).join('')+`</div>`}
function wire(){document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{cur=+c.dataset.i;nav('setup')})}
function home(){app.innerHTML=`<div class="hero"><div><h1>Faites le métier avant d’avoir le poste.</h1><p class="lede">Huit spécialités, huit situations professionnelles réalistes. Décidez sous pression, constatez les conséquences et recevez une orientation métier personnalisée.</p><div class="row"><button class="btn" id="go">Choisir ma spécialité</button></div></div>${scene(0,'#6d4fd1').replace('<svg','<svg style="border-radius:18px;width:100%;color:#6d4fd1"')}</div><h2>Spécialités</h2>${cards()}`;
$('#go').onclick=()=>nav('missions');wire()}
function missions(){app.innerHTML=`<h2>Choisissez votre spécialité</h2><p class="muted">Toutes les missions sont jouables : 3 décisions, avec des événements qui dépendent de vos choix.</p>${cards()}`;wire()}
function setup(){const f=F[cur],o=S&&S.cfg||{mode:'learn',diff:'std'},cfg={...o};
app.innerHTML=`<div class="top"><div style="color:${f.col}">${scene(cur,f.col)}</div><div><h2>${f.n}</h2><p class="muted" style="margin:0 0 6px">${f.ro}</p><div class="panel memo"><small>Note de service</small><p style="margin:4px 0 0">${f.ctx}</p></div></div></div>
<div class="panel"><h3>Mode</h3><div class="seg" id="sm"><button data-v="learn" class="${o.mode=='learn'?'on':''}">Apprentissage (indices et retours)</button><button data-v="pro" class="${o.mode=='pro'?'on':''}">Professionnel (sans aide)</button></div>
<h3 style="margin-top:20px">Difficulté</h3><div class="seg" id="sd"><button data-v="std" class="${o.diff=='std'?'on':''}">Standard</button><button data-v="hard" class="${o.diff=='hard'?'on':''}">Difficile (barème plus exigeant)</button></div>
<p style="margin-top:22px"><button class="btn" id="st">Lancer la simulation</button></p></div>`;
for(const [id,k] of [['sm','mode'],['sd','diff']])$('#'+id).onclick=e=>{const v=e.target.dataset.v;if(!v)return;cfg[k]=v;[...$('#'+id).children].forEach(b=>b.classList.toggle('on',b.dataset.v===v))};
$('#st').onclick=()=>{S={cfg,v:f.m.map(x=>x[2]),i:0,sc:[0,0,0,0],log:[],r:null};nav('play')}}
function play(){const f=F[cur],r=f.r[S.i],learn=S.cfg.mode=='learn';S.r=r;
let tw='';if(S.i==2){const a=S.sc.reduce((x,y)=>x+y,0)/(S.i*40);tw=`<p class="tw"><b>Événement.</b> ${f.tw[a>=.65?0:1]}</p>`}
const mt=f.m.map((x,k)=>`<div class="m"><small>${x[0]}</small><strong>${S.v[k]}${x[1]}</strong></div>`).join('')+`<div class="m"><small>Décision</small><strong>${S.i+1} sur 3</strong></div>`;
app.innerHTML=`<div class="meters">${mt}</div><div class="panel memo"><small>${esc(r.t)}</small>${tw}<h2>${esc(r.q)}</h2>${learn?'<button class="btn ghost" id="hb">Afficher un indice</button><div class="hint" id="ht">'+esc(r.h)+'</div>':''}<div class="opts" id="op">${r.o.map((o,i)=>`<button class="opt" data-i="${i}"><b>${esc(o[0])}</b>${learn?'<span>'+esc(o[1])+'</span>':''}</button>`).join('')}</div><div id="fbk"></div></div>`;
if(learn)$('#hb').onclick=()=>{$('#ht').style.display='block'};
$('#op').onclick=e=>{const b=e.target.closest('.opt');if(b&&!b.disabled)choose(+b.dataset.i)}}
function choose(i){const f=F[cur],r=S.r,o=r.o[i],hard=S.cfg.diff=='hard',learn=S.cfg.mode=='learn';
o[2].forEach((d,k)=>S.v[k]=Math.max(0,S.v[k]+d));
const q=o[3].split('').map(n=>Math.max(0,+n-(hard?1:0)));q.forEach((n,k)=>S.sc[k]+=n);
const sum=x=>x[3].split('').reduce((a,b)=>a+ +b,0),bst=r.o.reduce((a,b)=>sum(b)>sum(a)?b:a);
S.log.push({t:r.t,pick:o[0],best:bst[0],ok:bst===o});
document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k===i)b.classList.add('pick');if(learn&&r.o[k]===bst)b.classList.add('best')});
const last=S.i>=2;
$('#fbk').innerHTML=(learn?`<div class="fb"><b>${bst===o?'Excellent choix.':'Une meilleure option existait :'}</b> ${bst===o?esc(o[1]):esc(bst[0])+'. '+esc(bst[1])}</div>`:'')+`<p><button class="btn" id="nx">${last?'Voir mon rapport':'Décision suivante'}</button></p>`;
$('#nx').onclick=()=>{if(last)finish();else{S.i++;play();scrollTo(0,0)}}}
function finish(){const pct=S.sc.map(v=>Math.round(v/30*100)),total=Math.round(pct.reduce((a,b)=>a+b,0)/4);
S.res={pct,total};hist.unshift({f:F[cur].n,d:new Date().toLocaleDateString('fr-FR'),mode:S.cfg.mode,diff:S.cfg.diff,total});hist=hist.slice(0,30);
try{localStorage.setItem('dw-hist2',JSON.stringify(hist))}catch(e){}nav('report')}
function report(){const f=F[cur],{pct,total}=S.res,idx=pct.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]),top=SK[idx[0][1]],low=SK[idx[3][1]];
const grade=total>=80?'Excellent':total>=60?'Solide':total>=40?'À consolider':'Atterrissage difficile';
const tips={'Analyse':'Rassemblez des données avant d’agir.','Gestion des risques':'Privilégiez les options qui limitent la perte possible.','Prise de décision':'Pesez les effets à court et à long terme avant de vous engager.','Adaptabilité':'Quand la situation change, révisez votre plan.'};
const ori=total>=60?`Vos réflexes correspondent bien à ce métier. Pistes : ${f.car}.`:`Ce domaine demande encore de la pratique. Rejouez en mode apprentissage, puis visez : ${f.car}.`;
app.innerHTML=`<h2>Rapport de mission · ${f.n}</h2><div class="panel"><div class="row"><div><div class="muted">Score global</div><div style="font:800 3.4rem 'Bricolage Grotesque';color:var(--acc)">${total}<span class="muted" style="font-size:1.3rem">/100</span></div></div><div><span class="pill">${grade}</span><p style="margin:6px 0 0">${S.v.map((v,k)=>f.m[k][0]+' : '+v+f.m[k][1]).join(' · ')}</p></div></div>${SK.map((s,i)=>`<div class="sk"><span>${s}</span><div class="bar"><i style="width:${pct[i]}%"></i></div><b>${pct[i]}</b></div>`).join('')}</div>
<div class="grid" style="margin-top:14px"><div class="panel"><h3>Point fort</h3><p>${top}. ${tips[top]}</p></div><div class="panel"><h3>À améliorer</h3><p>${low}. ${tips[low]}</p></div><div class="panel"><h3>Orientation professionnelle</h3><p>${ori}</p></div></div>
<div class="panel" style="margin-top:14px"><h3>Vos décisions</h3><div style="overflow-x:auto"><table><tr><th>Étape</th><th>Votre choix</th><th>Meilleure option</th></tr>${S.log.map(l=>`<tr><td>${esc(l.t)}</td><td>${esc(l.pick)}</td><td>${l.ok?'Même choix':esc(l.best)}</td></tr>`).join('')}</table></div></div>
<p class="row"><button class="btn" id="again">Rejouer avec une autre stratégie</button><button class="btn ghost" id="oth">Autre spécialité</button><button class="btn ghost" id="dd">Ma progression</button></p>`;
$('#again').onclick=()=>nav('setup');$('#oth').onclick=()=>nav('missions');$('#dd').onclick=()=>nav('dash')}
function dash(){const tried=F.filter(f=>best(f.n)).length,bs=hist.length?Math.max(...hist.map(h=>h.total)):0,av=hist.length?Math.round(hist.reduce((a,h)=>a+h.total,0)/hist.length):0;
app.innerHTML=`<h2>Ma progression</h2><div class="meters"><div class="m"><small>Missions terminées</small><strong>${hist.length}</strong></div><div class="m"><small>Meilleur score</small><strong>${bs}</strong></div><div class="m"><small>Moyenne</small><strong>${av}</strong></div><div class="m"><small>Spécialités essayées</small><strong>${tried} sur 8</strong></div></div>
<div class="panel">${hist.length?`<div style="overflow-x:auto"><table><tr><th>Date</th><th>Spécialité</th><th>Mode</th><th>Niveau</th><th>Score</th></tr>${hist.map(h=>`<tr><td>${h.d}</td><td>${h.f}</td><td>${h.mode=='learn'?'Apprentissage':'Professionnel'}</td><td>${h.diff=='hard'?'Difficile':'Standard'}</td><td>${h.total}</td></tr>`).join('')}</table></div>`:'<p class="muted">Aucune mission pour l’instant. Choisissez une spécialité pour commencer.</p><button class="btn" id="g2">Choisir ma spécialité</button>'}</div>`;
const g=$('#g2');if(g)g.onclick=()=>nav('missions')}
nav('home');
</script>
</body>
</html>
